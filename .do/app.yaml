name: ai-swarm-v7
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_ORG/ai-swarm-v7
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm run start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000
    routes:
      - path: /
    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
        scope: BUILD_TIME
      - key: PORT
        value: "3000"
        scope: RUN_TIME
